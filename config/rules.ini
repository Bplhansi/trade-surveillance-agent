; Thresholds for the baseline rules.
; Change these and re-run tsa_replay; no recompiling needed.
; Tune on the VALIDATION set only. The test set is scored once, at the end.

[general]
cooldown_s = 60              ; at most one alert per rule + trader + symbol in this many seconds

[spoofing]
; Fires on a Cancel when, in the last 1 s for this trader + symbol:
large_order_qty = 1000       ; orders of at least this many shares count as "large"
min_large_cancels = 3        ; at least this many large orders were cancelled
min_large_cancel_ratio = 0.8 ; and large cancels / large orders placed is at least this

[wash_trade]
; Fires on a Trade when, in the last 60 s for this trader + symbol:
min_trades = 6               ; at least this many own trades
min_volume = 500             ; bought at least this many shares AND sold at least this many
max_net_ratio = 0.05         ; |bought - sold| / (bought + sold) is at most this
min_self_trades = 1          ; and at least this many fills had them on BOTH sides (0 = off).
                             ; Added after validation iteration 1: all 9 false alarms there were
                             ; balanced traders who never traded with themselves (docs/results.md).

[pump_and_dump]
; (a) On a Buy trade: mark the trader + symbol as "pumping" if, in the last 60 s,
min_net_qty = 2000           ;     net shares bought is at least this
min_rise_pct = 1.0           ;     and their own trade price rose at least this many percent
; (b) On a Sell trade by a marked trader + symbol: alert if
min_sell_qty = 1000          ;     they sold at least this many shares in the last 60 s
sell_within_s = 600          ;     within this many seconds of being marked

[model]
; Used only when tsa_replay is given --model <file.onnx>.
; Score = -log10 P(normal) from the gradient boosted model; at or above threshold -> alert.
threshold = 6.918224320918526  ; chosen on validation (models/model_card.json)
; Cheap first check: only these events are sent to the model (chosen on validation).
gate_min_large_cancels_1s = 1  ; a Cancel, after at least this many large cancels in 1 s
gate_min_trades_60s = 2        ; a Trade, by a trader with at least this many trades in 60 s
